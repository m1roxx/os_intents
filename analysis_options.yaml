include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Deliberately *not* "**/*.g.dart". Excluding it hid a generator bug that
    # emitted the literal word `null` as a type name into committed Dart — the
    # example stopped building for iOS and analyze stayed green. The emitter
    # writes `// ignore_for_file: type=lint` into every file it produces, so
    # what analysis sees here is errors only, which is exactly the point.
    - "probe/**/build/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - public_member_api_docs
    - unawaited_futures
