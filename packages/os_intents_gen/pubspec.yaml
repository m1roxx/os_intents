name: os_intents_gen
description: "The build_runner generator for os_intents. Emits the Dart dispatcher and the Swift and Kotlin the OS needs at compile time."
version: 0.1.0
repository: https://github.com/m1roxx/os_intents
issue_tracker: https://github.com/m1roxx/os_intents/issues
topics: [app-intents, siri, shortcuts, codegen, build-runner]
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  analyzer: ^8.0.0
  build: ^3.0.0
  source_gen: ^4.0.0
  os_intents: ^0.1.0

dev_dependencies:
  build_runner: ^2.4.13
  lints: ^6.0.0
  # Only for swift_compiles_test.dart, which reaches across the workspace to
  # type-check the emitter's output against the real plugin sources.
  path: ^1.9.0
  test: ^1.25.0
  # Only for emit_shortcuts_test.dart, which parses the emitted XML rather than
  # matching substrings of it — aapt will parse it too.
  xml: ^6.5.0
