name: os_intents_android
description: "Android implementation of os_intents: bridges generated AppFunctions and shortcuts into Dart. You want os_intents — this resolves with it."
version: 0.2.0
repository: https://github.com/m1roxx/os_intents
issue_tracker: https://github.com/m1roxx/os_intents/issues
topics: [app-functions, app-actions, shortcuts, assistant]
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  os_intents_platform_interface: ^0.2.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: os_intents
    platforms:
      android:
        package: dev.osintents.os_intents_android
        pluginClass: OsIntentsAndroidPlugin
        dartPluginClass: OsIntentsAndroid
