name: os_intents
description: "Declare OS-level app actions in Dart. Generates iOS App Intents and Android AppFunctions — no Swift or Kotlin by hand."
version: 0.1.0
repository: https://github.com/m1roxx/os_intents
issue_tracker: https://github.com/m1roxx/os_intents/issues
topics: [app-intents, siri, shortcuts, assistant, codegen]
resolution: workspace

# Rendered on the package page and in search results. The path has to be inside
# the published package, which is why the GIF lives here rather than in docs/.
screenshots:
  - description: >-
      A Dart-declared action run from the iOS Shortcuts app: iOS asks for the missing parameter, runs the handler in the background, never shows the app.
    path: screenshots/shortcuts_demo.gif

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  os_intents_platform_interface: ^0.1.0
  os_intents_android: ^0.1.0
  os_intents_ios: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
