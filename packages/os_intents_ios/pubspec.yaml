name: os_intents_ios
description: "Apple-platform implementation of os_intents: bridges generated App Intents into Dart, on iOS and macOS. You want os_intents — this resolves with it."
version: 0.2.0
repository: https://github.com/m1roxx/os_intents
issue_tracker: https://github.com/m1roxx/os_intents/issues
topics: [app-intents, siri, shortcuts, assistant]
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  os_intents_platform_interface: ^0.2.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: os_intents
    platforms:
      ios:
        pluginClass: OsIntentsIosPlugin
        dartPluginClass: OsIntentsIos
      # Same Swift, same Dart. The package is called os_intents_ios because it
      # was published under that name before macOS was in it, and a published
      # name cannot be changed — App Intents is one framework across Apple's
      # platforms and this is one implementation of it.
      macos:
        pluginClass: OsIntentsIosPlugin
        dartPluginClass: OsIntentsIos
