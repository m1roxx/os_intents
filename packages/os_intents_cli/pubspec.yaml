name: os_intents_cli
description: "Carries generated os_intents code into the native project, and verifies it arrived."
version: 0.1.0
repository: https://github.com/m1roxx/os_intents
issue_tracker: https://github.com/m1roxx/os_intents/issues
topics: [app-intents, siri, shortcuts, codegen, cli]
resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.6.0
  # An APK is a zip, and the AppFunctions metadata doctor reads lives inside it.
  archive: ^4.0.0
  crypto: ^3.0.6
  os_intents_gen: ^0.1.0
  path: ^1.9.0
  # That metadata is plain XML in assets/, so unlike the iOS side there is a
  # real grammar to parse rather than a format to reverse-engineer.
  xml: ^6.5.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  os_intents:
